spring:
  application:
    name: auth-service
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/authdb}
    username: ${DATABASE_USERNAME:}
    password: ${DATABASE_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
auth:
  jwt:
    # Supply a random base64 key of at least 32 bytes through JWT_SECRET.
    secret: ${JWT_SECRET:}
    issuer: ${JWT_ISSUER:auth-service}
    access-token-ttl: ${ACCESS_TOKEN_TTL:15m}
    refresh-token-ttl: ${REFRESH_TOKEN_TTL:15d}
